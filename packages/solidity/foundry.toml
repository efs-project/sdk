[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  # Consumers remap this package as:
  #   @efs/solidity/=node_modules/@efs/solidity/
  "@efs/solidity/=src/",
]

[fmt]
line_length = 100
tab_width = 4
