name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts:
    name: TypeScript (build, typecheck, test, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @efs/sdk build
      - run: pnpm --filter @efs/sdk typecheck
      - run: pnpm --filter @efs/sdk test
      - run: pnpm lint

  solidity:
    name: Solidity (build, test, fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - working-directory: packages/solidity
        run: |
          # forge-std is a test-only dep (not shipped); clone it rather than
          # `forge install` to avoid submodule/flag churn across Foundry versions.
          git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
          forge build
          forge test
          forge fmt --check

  changeset:
    name: Changeset present
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset status --since=origin/main
